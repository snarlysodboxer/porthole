---
# team-a opts into Secret/ConfigMap key-name metadata (never values - see
# the README's tradeoff section) by binding the aggregated
# porthole-readonly-with-secrets role instead of porthole-readonly: still
# one RoleBinding, and the roleRef name states the choice. Keep in
# lockstep with the --enable-secret-metadata / --enable-configmap-metadata
# config keys.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: porthole-readonly-with-secrets
  namespace: team-a
  labels:
    app.kubernetes.io/name: porthole
    app.kubernetes.io/part-of: porthole
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: porthole-readonly-with-secrets
subjects:
- kind: ServiceAccount
  name: porthole
  namespace: porthole
