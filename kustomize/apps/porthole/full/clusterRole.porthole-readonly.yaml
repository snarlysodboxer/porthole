---
# The base rule set plus pods/log for the pod_logs tool. RBAC rule
# lists have no merge key, so this patch must carry the complete rules
# list. Keep it in lockstep with the base.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: porthole-readonly
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - events
  - services
  - persistentvolumeclaims
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
- apiGroups:
  - cert-manager.io
  - argoproj.io
  - gateway.networking.k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
