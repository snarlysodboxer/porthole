---
# The base rule set plus pods/log for the pod_logs tool. RBAC rule
# lists have no merge key, so this patch must carry the complete rules
# list. Keep it in lockstep with the base.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: porthole-readonly
  labels:
    # Feeds the aggregated porthole-readonly-with-secrets role.
    aggregate-to-porthole-readonly-with-secrets: "true"
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - events
  - services
  - persistentvolumeclaims
  - serviceaccounts
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - get
  - list
# PodMetrics (top_pods) is namespaced, so it fits the RoleBinding model.
# Requires something to serve metrics.k8s.io (e.g. metrics-server).
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  verbs:
  - get
  - list
# Custom resource groups for the resource_conditions / resource_status
# tools. Enumerate the groups your cluster actually runs.
- apiGroups:
  - cert-manager.io
  - argoproj.io
  - gateway.networking.k8s.io
  - k8s.mariadb.com
  - grafana.integreatly.org
  resources:
  - '*'
  verbs:
  - get
  - list
