---
# The more-permissioned variant: everything in base, plus the grants and
# feature flags that go beyond the minimal posture.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base
- clusterRole.porthole-cluster-readonly.yaml
- clusterRoleBinding.porthole-cluster-readonly.yaml
# The secret/configmap-metadata grant is defined here but deliberately not
# bound. Bind in your overlay see overlays/prod/porthole for examples.
- clusterRole.porthole-secret-metadata.yaml
- clusterRole.porthole-readonly-with-secrets.yaml

configMapGenerator:
- name: porthole
  namespace: porthole
  behavior: merge
  literals:
  - enableCRDStatus=true
  - enableLogs=true
  - enableSecretMetadata=true
  - enableConfigMapMetadata=true
  # Cluster-scoped kinds the generic tools may serve; keep in lockstep
  # with the porthole-cluster-readonly ClusterRole.
  - clusterKinds=[CHANGEME, CHANGEME]
  # Exact annotation keys to include in responses (last-applied is always denied):
  # - allowedAnnotations=[example.com/team]

patches:
- path: clusterRole.porthole-readonly.yaml
