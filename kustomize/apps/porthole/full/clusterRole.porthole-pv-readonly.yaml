---
# Lets pvc_status enrich PVCs with their bound PersistentVolume's
# detail. PersistentVolumes are cluster-scoped, so this is the one grant
# that needs a ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: porthole-pv-readonly
  labels:
    app.kubernetes.io/name: porthole
    app.kubernetes.io/part-of: porthole
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
