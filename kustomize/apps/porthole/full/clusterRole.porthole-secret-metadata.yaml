---
# Grants for the flag-gated secret_metadata / configmap_metadata tools
# (key names and metadata only - the server never puts values in a response.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: porthole-secret-metadata
  labels:
    app.kubernetes.io/name: porthole
    app.kubernetes.io/part-of: porthole
    # Feeds the aggregated porthole-readonly-with-secrets role.
    aggregate-to-porthole-readonly-with-secrets: "true"
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
