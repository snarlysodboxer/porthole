---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: porthole
  namespace: porthole
  labels:
    app.kubernetes.io/name: porthole
    app.kubernetes.io/part-of: porthole
spec:
  # Internal troubleshooting tool - a brief interruption on reschedule is acceptable.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: porthole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: porthole
        app.kubernetes.io/part-of: porthole
    spec:
      serviceAccountName: porthole
      automountServiceAccountToken: true
      containers:
      - name: porthole
        image: registry.example.com/porthole:v0.1.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/porthole
        args:
        - --mode=http
        - --listen-addr=:8080
        # Keep the namespaces in lockstep with the porthole-readonly RoleBindings.
        - --namespaces=CHANGEME
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 35m
            memory: 64Mi
        livenessProbe:
          periodSeconds: 30
          initialDelaySeconds: 10
          httpGet:
            port: http
            path: /healthz
        readinessProbe:
          periodSeconds: 10
          initialDelaySeconds: 2
          httpGet:
            port: http
            path: /healthz
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePolicy: FallbackToLogsOnError
